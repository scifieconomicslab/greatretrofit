[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retrofit-model"
version = "0.1.0"
description = "Housing retrofit co-op simulation models (v1 and v2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-snapshot>=0.8",
    "matplotlib>=3.7",
]
plot = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["v1/test_v1", "v2/test_v2"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["v1/src", "v2/src", "common/src"]
include = ["retrofit_v1*", "retrofit_v2*", "common*"]